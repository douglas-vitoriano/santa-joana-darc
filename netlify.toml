[build]
  command = "bundle exec bridgetown build"
  publish = "output"

# ── Service Worker: nunca cachear no browser ──────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# ── Manifest: sem cache agressivo ─────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# ── Assets com hash do esbuild: 1 ano imutável ────────
[[headers]]
  for = "/_bridgetown/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Imagens: cache longo ──────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ── Páginas HTML: sem cache ───────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
