# .github/workflows/deploy.yml
name: Deploy · Santa Joana d'Arc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.8"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ativar Corepack (Yarn 4)
        run: corepack enable

      - name: Instalar dependências Node
        run: yarn install

      - name: Build Bridgetown
        run: bundle exec bridgetown deploy
        env:
          BRIDGETOWN_ENV: production

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy output --project-name=santa-joana-darc --branch=main