name: Deploy · Santa Joana d'Arc

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparo manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Ruby ────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true       # instala gems e faz cache automático

      # ── Node ────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências Node
        run: npm ci

      # ── Build ────────────────────────────────────────
      - name: Build Bridgetown
        run: bundle exec bridgetown deploy
        env:
          BRIDGETOWN_ENV: production

      # ── Deploy → Cloudflare Pages ────────────────────
      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy output --project-name=santa-joana-darc --branch=main