- titulo: "Introdução à Teologia"
  descricao: "O estudo da fé em busca do entendimento. Uma imersão nos fundamentos racionais e revelados sobre a natureza de Deus e Sua relação com a criação."

- titulo: "Catecismo"
  descricao: "A síntese da fé católica. O caminho seguro para compreender a doutrina, a liturgia, a vida em Cristo e a oração dentro da Tradição da Igreja."

- titulo: "Semana Santa"
  descricao: "A celebração do Mistério Pascal. Uma jornada espiritual pelos dias que mudaram a história: da Paixão e Morte à vitória da Ressurreição."

- titulo: "Introdução à Mariologia"
  descricao: "Os fundamentos da doutrina mariana, o papel de Maria na História da Salvação e os Dogmas."

- titulo: "Vida dos Santos"
  descricao: "Relatos de coragem e santidade. A hagiografia daqueles que, em diferentes tempos, responderam ao chamado de Deus com uma entrega radical."

- titulo: "Céu, Purgatorio e Inferno + Angeologia"
  descricao: "As realidades últimas e o mundo invisível. Um estudo sobre o destino eterno da alma e a missão dos anjos na guarda e no serviço ao Reino de Deus."
